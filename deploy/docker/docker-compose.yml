version: '3.9'

services:
  generatedocservice-api:
    image: generatedocservice-api:dev
    build:
      context: ../..
      dockerfile: src/Host/GenerateDocService.Api/Dockerfile
    environment:
      # Production, so the container does not serve the developer exception page: it renders stack
      # traces and absolute source paths to any caller.
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # Scalar and OpenAPI are documented for this stack, so opt in explicitly instead of relying on
      # the Development environment. Health probes stay minimal; set
      # DocumentProcessing__Api__ExposeHealthDetails to 'true' to publish per-check detail.
      DocumentProcessing__Api__ExposeOpenApi: 'true'
      DocumentProcessing__Authentication__Enabled: 'true'
      DocumentProcessing__Authentication__SigningKey: ${GDS_AUTH_SIGNING_KEY:?GDS_AUTH_SIGNING_KEY must be set to a secret of at least 32 characters}
      DocumentProcessing__Caching__Provider: Redis
      DocumentProcessing__Caching__Redis__ConnectionString: redis:6379
      DocumentProcessing__Messaging__Transport: RabbitMQ
      DocumentProcessing__Messaging__RabbitMq__Host: rabbitmq
      DocumentProcessing__Messaging__RabbitMq__Port: 5672
      DocumentProcessing__Messaging__RabbitMq__Username: guest
      DocumentProcessing__Messaging__RabbitMq__Password: guest
      DocumentProcessing__Storage__Provider: ObjectStorage
      DocumentProcessing__Storage__ObjectStorage__Endpoint: http://minio:9000
      DocumentProcessing__Storage__ObjectStorage__BucketName: documents
      DocumentProcessing__Storage__ObjectStorage__AccessKey: minioadmin
      DocumentProcessing__Storage__ObjectStorage__SecretKey: minioadmin
      DocumentProcessing__Storage__ObjectStorage__UseSsl: 'false'
      DocumentProcessing__Storage__ObjectStorage__CreateBucketIfMissing: 'true'
      DocumentProcessing__Persistence__Provider: PostgreSql
      DocumentProcessing__Persistence__PostgreSql__ConnectionString: Host=postgres;Port=5432;Database=generatedocservice;Username=postgres;Password=postgres
      # The FOP converter runs in a separate compose project, so the in-container
      # default of localhost:8080 would resolve to this container instead.
      DocumentProcessing__Fop__BaseUrl: ${FOP_CONVERTER_BASE_URL:-http://host.docker.internal:8080/}
    extra_hosts:
      # Makes host.docker.internal resolve on Linux Docker Engine as well as Docker Desktop.
      - "host.docker.internal:host-gateway"
    ports:
      # Host port 8081 avoids clashing with the fopconverter stack on 8080.
      - "8081:8080"
    depends_on:
      - rabbitmq
      - redis
      - minio
      - postgres

  generatedocservice-worker:
    image: generatedocservice-worker:dev
    build:
      context: ../..
      dockerfile: src/Host/GenerateDocService.Worker/Dockerfile
    environment:
      DocumentProcessing__Caching__Provider: Redis
      DocumentProcessing__Caching__Redis__ConnectionString: redis:6379
      DocumentProcessing__Messaging__Transport: RabbitMQ
      DocumentProcessing__Messaging__RabbitMq__Host: rabbitmq
      DocumentProcessing__Messaging__RabbitMq__Port: 5672
      DocumentProcessing__Messaging__RabbitMq__Username: guest
      DocumentProcessing__Messaging__RabbitMq__Password: guest
      DocumentProcessing__Storage__Provider: ObjectStorage
      DocumentProcessing__Storage__ObjectStorage__Endpoint: http://minio:9000
      DocumentProcessing__Storage__ObjectStorage__BucketName: documents
      DocumentProcessing__Storage__ObjectStorage__AccessKey: minioadmin
      DocumentProcessing__Storage__ObjectStorage__SecretKey: minioadmin
      DocumentProcessing__Storage__ObjectStorage__UseSsl: 'false'
      DocumentProcessing__Storage__ObjectStorage__CreateBucketIfMissing: 'true'
      DocumentProcessing__Persistence__Provider: PostgreSql
      DocumentProcessing__Persistence__PostgreSql__ConnectionString: Host=postgres;Port=5432;Database=generatedocservice;Username=postgres;Password=postgres
      # The worker performs the async generation, so it needs the converter too.
      DocumentProcessing__Fop__BaseUrl: ${FOP_CONVERTER_BASE_URL:-http://host.docker.internal:8080/}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - rabbitmq
      - redis
      - minio
      - postgres

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"

  redis:
    image: redis:7
    ports:
      # Host port 6380 avoids clashing with the fopconverter Redis on 6379.
      # Containers still reach it as redis:6379 over the compose network.
      - "127.0.0.1:6380:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: generatedocservice
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
